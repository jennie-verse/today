<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Three tasks for today. Nothing carries over automatically.">
  <meta name="format-detection" content="telephone=no">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FDF7F8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Today">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.github.com; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./assets/app.css">
  <title>Today</title>
</head>
<body>
  <div id="app-root">
    <div class="app">
      <header class="hdr">
        <h1>Today</h1>
        <button type="button" class="ico" id="open-settings" aria-label="Settings">⚙</button>
      </header>
      <div class="body-scroll" id="body-scroll">
        <section class="section" id="section-today">
          <div class="section-title">Today <span class="count" id="today-count"></span></div>
          <div class="today-slots" id="today-slots"></div>
        </section>
        <section class="section overflow-section" id="section-overflow" hidden aria-labelledby="overflow-title">
          <div class="section-title" id="overflow-title">Needs review <span class="count" id="overflow-count"></span></div>
          <p class="review-hint">Sync added more than three Today tasks. Nothing was hidden or moved automatically; move the extras to Someday when you are ready.</p>
          <div class="group-list" id="overflow-list"></div>
        </section>
        <section class="section" id="section-candidates" hidden>
          <div class="section-title">Today candidates <span class="count" id="candidates-count"></span></div>
          <div id="candidates-list"></div>
        </section>
        <section class="section">
          <details class="collapsible" id="someday-details">
            <summary><span class="chevron">▸</span> Someday <span class="count" id="someday-count"></span></summary>
            <div class="group-list" id="someday-list"></div>
          </details>
        </section>
        <section class="section">
          <details class="collapsible" id="done-details">
            <summary><span class="chevron">▸</span> Done <span class="count" id="done-count"></span></summary>
            <div class="group-list" id="done-list"></div>
          </details>
        </section>
      </div>
      <div class="add-bar">
        <input type="text" id="add-input" maxlength="200" placeholder="Add a task — try “tomorrow 9am call”" autocomplete="off" autocapitalize="sentences">
        <button type="button" id="add-submit" aria-label="Add task">＋</button>
      </div>
    </div>
  </div>
  <div id="sheet-host"></div>
  <div id="toasts" aria-live="polite" aria-atomic="true"></div>
  <div id="aria-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
